<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Comic Reader</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="reader" class="reader">

    <div id="reader-topbar" class="reader-topbar">
      <button class="btn-back" onclick="location.href='index.html'">&larr;</button>
      <span id="reader-title" class="title"></span>
      <span id="reader-counter" class="counter"></span>
    </div>

    <div class="reader-page">
      <div id="reader-spinner" class="reader-spinner"></div>
      <img id="reader-img" class="loading" alt="">

      <div id="tap-left" class="reader-tap-left"></div>
      <div id="tap-center" class="reader-tap-center"></div>
      <div id="tap-right" class="reader-tap-right"></div>
    </div>

    <div id="reader-bottombar" class="reader-bottombar">
      <button id="btn-prev">&lsaquo;</button>
      <div class="reader-progress">
        <div id="reader-progress-fill" class="reader-progress-fill"></div>
      </div>
      <button id="btn-next">&rsaquo;</button>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
